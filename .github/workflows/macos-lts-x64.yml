name: macOS Intel Qt 6.8 LTS

on:
  push:
    branches: [main, qmc2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  QT_ARTIFACT_ID: 'macos-x64'

concurrency:
  group: macos-x64-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Qt 6.8 LTS Intel (${{ matrix.configuration }})
    runs-on: macos-13
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            upload: false
          - configuration: Release
            upload: true

    steps:
      - name: Check out patch repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Build isolated QtScript
        shell: bash
        env:
          QSCRIPT_WORK_ROOT: ${{ runner.temp }}/qtscript-work
          QSCRIPT_INSTALL_PREFIX: ${{ runner.temp }}/qtscript-install
        run: >-
          bash ./scripts/build-macos.sh
          --qt-root "$QT_ROOT_DIR"
          --work-root "$QSCRIPT_WORK_ROOT"
          --install-prefix "$QSCRIPT_INSTALL_PREFIX"
          --configuration ${{ matrix.configuration }}
          --parallel 3
          --include-ported-tests

      - name: Run ported upstream test suites
        if: matrix.configuration == 'Debug'
        shell: bash
        env:
          QSCRIPT_WORK_ROOT: ${{ runner.temp }}/qtscript-work
          QT_QPA_PLATFORM: offscreen
        run: >-
          ctest --test-dir "$QSCRIPT_WORK_ROOT/build"
          --parallel 3
          --output-on-failure

      - name: Verify installed frameworks
        if: matrix.configuration == 'Release'
        shell: bash
        env:
          QSCRIPT_INSTALL_PREFIX: ${{ runner.temp }}/qtscript-install
        run: |
          otool -L "$QSCRIPT_INSTALL_PREFIX/lib/QtScript.framework/Versions/A/QtScript"
          otool -L "$QSCRIPT_INSTALL_PREFIX/lib/QtScriptTools.framework/Versions/A/QtScriptTools"
          ! otool -L "$QSCRIPT_INSTALL_PREFIX/lib/QtScript.framework/Versions/A/QtScript" | grep "$RUNNER_TEMP/qtscript-work"
          ! otool -L "$QSCRIPT_INSTALL_PREFIX/lib/QtScriptTools.framework/Versions/A/QtScriptTools" | grep "$RUNNER_TEMP/qtscript-work"

      - name: Upload QtScript install
        if: matrix.upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qtscript-qt${{ env.QT_VERSION }}-${{ env.QT_ARTIFACT_ID }}-${{ matrix.configuration }}
          path: ${{ runner.temp }}/qtscript-install
          if-no-files-found: error
          retention-days: 3
